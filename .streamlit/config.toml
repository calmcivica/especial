[theme]
primaryColor="#F63366"
backgroundColor="#FFFFFF"
secondaryBackgroundColor="#F0F2F6"
textColor="#262730"
font="sans serif"

[server]
enableCORS=false
enableXsrfProtection=false
maxUploadSize=200
enableWebsocketCompression=true

[browser]
gatherUsageStats=false
serverAddress="localhost"
serverPort=8501

[runner]
magicEnabled=true
fastRerenderEnabled=true
installTracer=false
fixMatplotlib=true

[client]
showErrorDetails=true
caching=true
displayEnabled=true